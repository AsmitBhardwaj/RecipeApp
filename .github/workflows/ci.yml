name: CI

# Runs on every push and every pull request.
on:
  push:
  pull_request:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend unit tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Production runs on Postgres, so the suite runs on it too (in addition to
    # SQLite). tests/__init__.py points db.init_db() at TEST_DATABASE_URL.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      # Match the deployed runtime (.python-version / Railway builds cp312 wheels).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest is a dev-only dependency — intentionally NOT in the production
          # requirements.txt (the Railway deploy manifest), so install it here.
          pip install pytest

      # No secrets needed: DATABASE_URL is cleared so the app uses a local SQLite
      # file (the same way the suite runs locally); APP_KEY unset => the app-key
      # gate fails open for tests.
      - name: Run pytest (SQLite)
        env:
          DATABASE_URL: ""
        run: python -m pytest tests/ -q

      # Same suite on Postgres 16. Two tests that build SQLite files / use SQLite
      # trigger syntax skip themselves when TEST_DATABASE_URL is set.
      - name: Run pytest (Postgres)
        env:
          DATABASE_URL: ""
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
        run: python -m pytest tests/ -q

  recipekit-tests:
    name: RecipeKit unit tests (swift test)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Point the toolchain at full Xcode so `swift test` can find XCTest
      # (the CommandLineTools toolchain doesn't ship it).
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version
          xcodebuild -version

      - name: swift test
        working-directory: ios/RecipeKit
        run: swift test

  app-build:
    name: Build RecipeApp (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      # Secrets.xcconfig is gitignored (it holds the real APP_KEY) but is the
      # RecipeApp target's base configuration, so the build needs *a* file there.
      # A placeholder from the committed example is enough to compile/link — CI
      # never talks to the backend.
      - name: Provide placeholder Secrets.xcconfig
        working-directory: ios
        run: cp Secrets.example.xcconfig Secrets.xcconfig

      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project RecipeApp.xcodeproj \
            -scheme RecipeApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
